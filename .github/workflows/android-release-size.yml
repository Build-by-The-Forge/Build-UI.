name: android-release-size

# Builds the Android release (arm64-v8a only) on the runner and reports the
# real APK and AAB sizes against the 100 MB download budget. The laptop has
# no JDK or Android SDK, so this is where the number comes from.
#
# The build is signed with the template's debug key: good enough to measure
# size, never to ship. The application id is set on the runner only
# (app.json has none yet; picking the real one is a product decision).

on:
  pull_request:
    branches: [main]
    paths:
      - 'mobile-app-main/**'
      - '.github/workflows/android-release-size.yml'
  push:
    branches: [main]
    paths:
      - 'mobile-app-main/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-size-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile-app-main

env:
  BUDGET_MB: 100
  CI_APPLICATION_ID: com.buildbytheforge.build.sizecheck

jobs:
  build:
    name: Release build size (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-app-main/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci --no-audit --no-fund

      - name: Set a CI-only application id (runner copy of app.json)
        run: |
          node -e '
            const fs = require("fs");
            const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
            app.expo.android = { ...(app.expo.android || {}) };
            if (!app.expo.android.package) app.expo.android.package = process.env.CI_APPLICATION_ID;
            fs.writeFileSync("app.json", JSON.stringify(app, null, 2));
            console.log("android.package =", app.expo.android.package);
          '

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK and AAB (arm64-v8a only)
        working-directory: mobile-app-main/android
        run: ./gradlew --no-daemon assembleRelease bundleRelease -PreactNativeArchitectures=arm64-v8a

      - name: Report sizes
        run: |
          apk=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          aab=$(ls android/app/build/outputs/bundle/release/*.aab | head -1)
          apk_b=$(stat -c %s "$apk"); aab_b=$(stat -c %s "$aab")
          mb() { awk -v b="$1" 'BEGIN { printf "%.1f", b / 1048576 }'; }
          {
            echo "## Android release size (arm64-v8a)"
            echo ""
            echo "| Artifact | Size | Budget |"
            echo "|---|---|---|"
            echo "| APK (\`$(basename "$apk")\`) | $(mb $apk_b) MB ($apk_b bytes) | ${BUDGET_MB} MB |"
            echo "| AAB (\`$(basename "$aab")\`) | $(mb $aab_b) MB ($aab_b bytes) | (Play generates per-device APKs from this) |"
            echo ""
            echo "Commit: \`${GITHUB_SHA}\`. The arm64-v8a APK is the closest stand-in for what a phone downloads."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "APK_BYTES=$apk_b" >> "$GITHUB_ENV"
          limit=$(( BUDGET_MB * 1048576 ))
          if [ "$apk_b" -gt "$limit" ]; then
            echo "::error::APK is $(mb $apk_b) MB, over the ${BUDGET_MB} MB budget"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: android-release-arm64
          path: |
            mobile-app-main/android/app/build/outputs/apk/release/*.apk
            mobile-app-main/android/app/build/outputs/bundle/release/*.aab
          retention-days: 7
